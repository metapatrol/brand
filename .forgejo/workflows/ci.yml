# Checks that run on every pull request, and on pushes to develop.
#
# The cheap check gates the expensive one:
#
#   secret-scan ──> check (install, tokens, build, assets, tests)
#
# The steps are the targets of `make ci`, so a local run and this one cannot
# drift apart. See .forgejo/README.md for the whole release flow.
#
# `runs-on: docker` names a runner *label*, not an image.
name: ci

# A ref is built once. Branch work is built through its pull request; develop
# keeps a push trigger because it also receives direct pushes — the post-release
# sync in main.yml is one — and those reach no pull request.
on:
  push:
    branches: [develop]
  pull_request:

env:
  # The instance uses a private CA the runner may not carry.
  GIT_SSL_NO_VERIFY: "true"
  # Same Node as the Angular 22 applications that consume these packages.
  NODE_VERSION: "26"

jobs:
  secret-scan:
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - name: Scan for committed credentials
        run: |
          M=""
          for t in curl tar make; do command -v $t >/dev/null || M="$M $t"; done
          [ -z "$M" ] || (apt-get update -qq && apt-get install -y -qq $M)
          make secret-scan

  check:
    needs: secret-scan
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://data.forgejo.org/actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # One step per target, so a failure names its stage.
      - run: make install
      - name: Tokens resolve and meet the contrast rules
        run: make check
      - run: make build
      # packages/brand is generated but committed so it can be reviewed; the build
      # is byte-reproducible, so a difference means it was not regenerated.
      - run: make assets-check
      - run: make test
