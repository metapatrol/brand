# Pushes to main: the checks again, then semantic-release decides whether the
# commits since the last tag warrant a version.
#
#   config, secret-scan ──> verify ──┬─> semantic-release ──> carry to develop
#                                   └─> site
#
# semantic-release writes CHANGELOG.md, sets the version on all five published
# packages (scripts/set-version.mjs, one version for all), commits
# `chore: release vX.Y.Z`, tags `vX.Y.Z` and dispatches release.yml, which
# publishes. Publishing is not done here: a tag can be released again, or by
# hand, without a push to main. See .forgejo/README.md.
#
# site: the brand site and the shell preview follow main, so a change to them
# goes out with its merge, whether or not it releases a version.
#
# `runs-on: docker` names a runner *label*, not an image.
name: main

on:
  push:
    branches: [main]

env:
  GIT_SSL_NO_VERIFY: "true"
  NODE_VERSION: "24"
  # From the runner, not hardcoded: the workflows are meant to be copied between
  # repositories without an edit. Nothing here is called FORGEJO_TOKEN; see
  # .forgejo/README.md.
  FORGEJO_BASE_URL: ${{ github.server_url }}
  FORGEJO_REPO: ${{ github.repository }}

jobs:
  # Whether this installation may release. Without AUTOMATION_TOKEN the repository
  # is not broken, merely not set up to release, so the release is skipped rather
  # than failed: a push that goes red for configuration nobody has got round to
  # only teaches people to ignore red.
  config:
    # Nothing to do for semantic-release's own commit: it changes the changelog
    # and the versions, and the tag it carries is release.yml's business.
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release v') }}"
    runs-on: docker
    outputs:
      release: ${{ steps.check.outputs.release }}
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        env:
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: |
          release=false
          deploy=false
          if [ -n "$AUTOMATION_TOKEN" ]; then
            release=true
          else
            echo "AUTOMATION_TOKEN is not set - skipping semantic-release"
          fi
          if [ -n "$S3_ENDPOINT" ] && [ -n "$S3_ACCESS_KEY" ] && [ -n "$S3_SECRET_KEY" ]; then
            deploy=true
          else
            echo "S3_ENDPOINT, S3_ACCESS_KEY or S3_SECRET_KEY is not set - skipping the site"
          fi
          for out in "$GITHUB_OUTPUT" "$FORGEJO_OUTPUT"; do
            [ -n "$out" ] || continue
            echo "release=$release" >> "$out"
            echo "deploy=$deploy" >> "$out"
          done
          echo "release=$release deploy=$deploy"

  secret-scan:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release v') }}"
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - name: Scan for committed credentials
        run: |
          M=""
          for t in curl tar make; do command -v $t >/dev/null || M="$M $t"; done
          [ -z "$M" ] || (apt-get update -qq && apt-get install -y -qq $M)
          make secret-scan

  verify:
    needs: secret-scan
    runs-on: docker
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: make install
      - run: make check
      - run: make build
      - run: make assets-check
      - run: make test

  site:
    needs: [verify, config]
    if: needs.config.outputs.deploy == 'true'
    runs-on: docker
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: make install
      - run: make build
      - run: make shell-preview
      - run: sh scripts/deploy.sh site

  semantic-release:
    needs: [verify, config]
    if: needs.config.outputs.release == 'true'
    runs-on: docker
    env:
      AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
        with:
          # semantic-release reads the whole history to work out what the
          # commits since the last tag amount to.
          fetch-depth: 0
      - uses: https://data.forgejo.org/actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Decide and tag a version
        env:
          GIT_AUTHOR_NAME: automation
          GIT_AUTHOR_EMAIL: automation@forge.metapatrol.com
          GIT_COMMITTER_NAME: automation
          GIT_COMMITTER_EMAIL: automation@forge.metapatrol.com
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: |
          # scripts/set-version.mjs updates the lockfile, which needs the workspace installed
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/exec \
            @semantic-release/git
          cat > /tmp/git-askpass.sh << 'ASKPASS'
          #!/bin/sh
          case "$1" in
            Username*) echo automation ;;
            Password*) echo "$AUTOMATION_TOKEN" ;;
          esac
          ASKPASS
          chmod +x /tmp/git-askpass.sh
          export GIT_ASKPASS=/tmp/git-askpass.sh
          npx semantic-release

      # semantic-release commits the changelog and the versions onto main and
      # nowhere else. Work is bundled on develop, so without this every release
      # leaves develop behind and the next release pull request opens with a
      # conflict in exactly the lines a human has no business resolving.
      #
      # A fast-forward when possible, a merge when develop has moved on — the only
      # move that keeps both sides and rewrites neither. Housekeeping either way,
      # so a failure to sync does not fail the release.
      - name: Carry the release commit back to develop
        continue-on-error: true
        env:
          GIT_AUTHOR_NAME: automation
          GIT_AUTHOR_EMAIL: automation@forge.metapatrol.com
          GIT_COMMITTER_NAME: automation
          GIT_COMMITTER_EMAIL: automation@forge.metapatrol.com
        run: |
          export GIT_ASKPASS=/tmp/git-askpass.sh
          if [ -z "$(git ls-remote --heads origin develop)" ]; then
            echo "no develop branch on the remote; nothing to carry"
            exit 0
          fi
          git fetch origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/develop:refs/remotes/origin/develop"
          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "develop already contains main; nothing to carry"
            exit 0
          fi
          if git merge-base --is-ancestor origin/develop origin/main; then
            git push origin origin/main:refs/heads/develop
            echo "develop fast-forwarded to $(git rev-parse --short origin/main)"
            exit 0
          fi
          echo "develop has commits main does not; merging instead."
          git checkout -q -B carry-to-develop origin/develop
          if git merge --no-ff -m "chore: carry main into develop after the release" origin/main; then
            git push origin HEAD:refs/heads/develop
            echo "develop merged with main at $(git rev-parse --short origin/main)"
          else
            git merge --abort
            echo "the merge conflicts, so nothing was pushed."
            echo "Open a pull request from main into develop and resolve it there."
            exit 1
          fi
