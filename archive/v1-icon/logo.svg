
<!-- logo.svg (with token pulsing animation, no glare) -->
<svg xmlns="http://www.w3.org/2000/svg" width="218" height="64" viewBox="0 0 218 64" role="img" aria-label="metapatrol">
    <defs>
        <style>
            /* Default colors (can be overridden via injected CSS in ) */
            .mp-bg{fill:#0B0F14}
            .mp-text{fill:#F5F7FA}
            .mp-accent{fill:#22D3EE}

            /* Pulse animation: tokens brighten one after another */
            @keyframes mpPulse {
            0%, 100% { opacity: var(--base, 1); }
            45%      { opacity: var(--base, 1); }
            55%      { opacity: 1; }
            }

            /* Each token keeps its base opacity, but peaks in sequence */
            .t1 { --base: .18; animation: mpPulse 1.8s ease-in-out infinite; animation-delay: 0s; }
            .t2 { --base: .38; animation: mpPulse 1.8s ease-in-out infinite; animation-delay: .15s; }
            .t3 { --base: .68; animation: mpPulse 1.8s ease-in-out infinite; animation-delay: .30s; }
            .t4 { --base: 1.0; animation: mpPulse 1.8s ease-in-out infinite; animation-delay: .45s; }

            @media (prefers-reduced-motion: reduce){
            .t1,.t2,.t3,.t4{ animation: none; }
            }
        </style>
    </defs>

    <!-- background -->
    <rect class="mp-bg" x="0" y="0" width="218" height="64" rx="12"></rect>

    <!-- icon: token stream + accent bar -->
    <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
        <!-- baseline -->
        <path d="M14 33H66" stroke="#F5F7FA" stroke-width="1.2" opacity="0.35"></path>

        <!-- filled tokens (small -> large, sharp corners) -->
        <rect class="mp-token t1" x="26" y="29" width="4" height="8" fill="#F5F7FA" opacity="0.18"></rect>
        <rect class="mp-token t2" x="34" y="28" width="5" height="10" fill="#F5F7FA" opacity="0.38"></rect>
        <rect class="mp-token t3" x="43" y="27" width="6" height="12" fill="#F5F7FA" opacity="0.68"></rect>
        <rect class="mp-token t4" x="53" y="26" width="7" height="14" fill="#F5F7FA" opacity="1.00"></rect>

        <!-- eyecatcher bar -->
        <rect class="mp-accent" x="66" y="16" width="1" height="48"></rect>
    </g>

    <!-- wordmark -->
    <text class="mp-text" x="78" y="41" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="28" font-weight="100" letter-spacing="0.1">metapatrol</text>
</svg>
